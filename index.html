<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Репетитор · ученический сад</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif; }
        body { background: #f8f3fa; min-height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; padding: 20px; }
        
        .app-container { 
            max-width: 1400px; 
            width: 100%; 
            background: rgba(255, 250, 252, 0.7); 
            backdrop-filter: blur(2px); 
            border-radius: 48px; 
            padding: 2rem; 
            box-shadow: 0 20px 40px -12px rgba(120, 80, 130, 0.25); 
            border: 1px solid #e5d5e9; 
        }
        
        .login-overlay { 
            position: fixed; 
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(60, 40, 70, 0.7); 
            backdrop-filter: blur(8px); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            z-index: 9999; 
            padding: 20px;
        }
        .login-card { 
            background: #fcf8fe; 
            border-radius: 60px; 
            padding: 2.5rem; 
            max-width: 440px; 
            width: 100%; 
            border: 1px solid #dcc7e2; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.3); 
            text-align: center; 
            max-height: 90vh;
            overflow-y: auto;
        }
        .login-card h2 { color: #4a2e4f; margin-bottom: 0.5rem; font-size: 1.8rem; }
        .login-card .subtitle { color: #7f5f89; margin-bottom: 1.5rem; font-size: 0.95rem; }
        .login-card .field-group { margin-bottom: 1rem; text-align: left; }
        .login-card label { display: block; font-weight: 500; color: #5e4166; margin-bottom: 0.3rem; font-size: 0.9rem; }
        .login-card input, .login-card select { 
            width: 100%; 
            padding: 0.8rem 1.2rem; 
            border-radius: 60px; 
            border: 1px solid #dcc7e2; 
            font-size: 1rem; 
            outline: none; 
            background: white;
        }
        .login-card input:focus, .login-card select:focus { border-color: #b48dbd; box-shadow: 0 0 0 3px rgba(180, 130, 190, 0.2); }
        .login-card .btn-primary { 
            width: 100%; 
            padding: 0.8rem; 
            font-size: 1rem; 
            background: #b48dbd;
            border: none;
            border-radius: 60px;
            font-weight: 500;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #c9a8d3;
        }
        .login-card .btn-primary:hover { background: #a47bae; transform: scale(0.98); }
        .login-card .btn-secondary { 
            background: transparent; 
            border: none; 
            color: #7f5f89; 
            cursor: pointer; 
            font-size: 0.9rem; 
            padding: 0.5rem;
        }
        .login-card .btn-secondary:hover { color: #4a2e4f; text-decoration: underline; }
        .login-card .error { 
            color: #8a4040; 
            background: #f7e6e6; 
            padding: 0.5rem 1rem; 
            border-radius: 30px; 
            font-size: 0.9rem; 
            margin-bottom: 1rem; 
        }
        .login-card .role-selector { 
            display: flex; 
            gap: 0.5rem; 
            margin-bottom: 1rem; 
            background: #efe6f2; 
            border-radius: 60px; 
            padding: 0.3rem;
        }
        .login-card .role-selector button { 
            flex: 1; 
            padding: 0.5rem; 
            border: none; 
            border-radius: 60px; 
            cursor: pointer; 
            font-weight: 500; 
            transition: 0.2s;
            background: transparent;
            color: #5e4166;
        }
        .login-card .role-selector button.active { 
            background: #b48dbd; 
            color: white; 
        }
        .login-card .hint { 
            font-size: 0.8rem; 
            color: #9a82a2; 
            margin-top: 1.5rem; 
            border-top: 1px dashed #dcc7e2; 
            padding-top: 1rem;
        }

        .header-botanical { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 2rem; flex-wrap: wrap; border-bottom: 2px dashed #cdb5d4; padding-bottom: 1.2rem; }
        .header-botanical h1 { font-weight: 400; font-size: 2.1rem; letter-spacing: 2px; color: #4a2e4f; display: flex; align-items: center; gap: 0.6rem; }
        .header-botanical h1 i { color: #7d5f86; font-size: 2rem; }
        .botanical-icon { background: #ebdfef; padding: 0.4rem 0.9rem; border-radius: 60px; font-size: 0.9rem; color: #553a5c; border: 1px solid #d5bedb; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .role-badge { 
            background: #b48dbd; 
            color: white; 
            padding: 0.2rem 1rem; 
            border-radius: 60px; 
            font-size: 0.8rem; 
            font-weight: 500;
        }
        .role-badge.parent { background: #7d9b9b; }

        .btn-circle { background: #efe6f2; border: 1px solid #d5bedb; border-radius: 60px; width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; color: #553a5c; font-size: 1rem; cursor: pointer; transition: 0.15s; }
        .btn-circle:hover { background: #dcc7e2; border-color: #b48dbd; }
        .btn-circle.today-btn { background: #b48dbd; color: white; border-color: #b48dbd; width: auto; padding: 0 1.2rem; font-weight: 500; font-size: 0.85rem; }
        .btn-circle.today-btn:hover { background: #a47bae; }

        .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .tab-btn { background: #efe6f2; border: 1px solid #d5bedb; border-radius: 60px; padding: 0.5rem 1.5rem; font-weight: 500; color: #553a5c; cursor: pointer; transition: 0.15s; font-size: 0.95rem; }
        .tab-btn:hover { background: #dcc7e2; }
        .tab-btn.active { background: #b48dbd; color: white; border-color: #b48dbd; }

        .calendar-nav { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; background: #fcf8fe; border-radius: 60px; padding: 0.6rem 1.5rem; margin-bottom: 1.5rem; border: 1px solid #dcc7e2; }
        .calendar-nav .date-display { font-size: 1.1rem; font-weight: 450; color: #3b2740; min-width: 160px; text-align: center; }

        .slots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; margin: 1rem 0; }
        .slot-card { 
            background: #fcf8fe; 
            border-radius: 30px; 
            padding: 1.5rem; 
            border: 1px solid #decbe3; 
            transition: 0.15s; 
            position: relative;
        }
        .slot-card:hover { border-color: #cbafd3; box-shadow: 0 4px 12px rgba(140, 100, 160, 0.1); }
        .slot-card.booked { border-color: #eac8c8; background: #fdf8f8; }
        .slot-card .time { font-size: 1.2rem; font-weight: 500; color: #3b2740; }
        .slot-card .status { 
            display: inline-block; 
            padding: 0.2rem 1rem; 
            border-radius: 60px; 
            font-size: 0.8rem; 
            font-weight: 500;
            margin-top: 0.5rem;
        }
        .slot-card .status.free { background: #d9ebd9; color: #1f5420; }
        .slot-card .status.booked { background: #f7e6e6; color: #8a4040; }
        .slot-card .student-info { 
            margin-top: 0.5rem; 
            padding: 0.5rem; 
            background: #efe6f2; 
            border-radius: 20px; 
            font-size: 0.9rem;
        }
        .slot-card .actions { margin-top: 0.8rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .slot-card .actions button { 
            padding: 0.3rem 1rem; 
            border-radius: 60px; 
            border: none; 
            cursor: pointer; 
            font-size: 0.8rem; 
            font-weight: 500;
            transition: 0.15s;
        }
        .slot-card .actions .btn-book { background: #b48dbd; color: white; }
        .slot-card .actions .btn-book:hover { background: #a47bae; }
        .slot-card .actions .btn-cancel { background: #e9d4ed; color: #55335e; }
        .slot-card .actions .btn-cancel:hover { background: #dcbfe2; }
        .slot-card .actions .btn-delete { background: #f7e6e6; color: #8a4040; }
        .slot-card .actions .btn-delete:hover { background: #eac8c8; }

        .add-slot-form { 
            background: #fcf8fe; 
            border-radius: 40px; 
            padding: 1.5rem 2rem; 
            margin: 1.5rem 0; 
            border: 1px solid #dcc7e2; 
            display: flex; 
            flex-wrap: wrap; 
            align-items: flex-end; 
            gap: 1rem 1.5rem; 
        }
        .add-slot-form .field-group { display: flex; flex-direction: column; gap: 0.3rem; flex: 1 0 120px; }
        .add-slot-form label { font-size: 0.8rem; font-weight: 500; color: #5e4166; }
        .add-slot-form input { background: white; border: 1px solid #dcc7e2; border-radius: 40px; padding: 0.6rem 1rem; font-size: 0.9rem; outline: none; width: 100%; }
        .add-slot-form input:focus { border-color: #b48dbd; }

        .btn-primary { background: #b48dbd; border: none; border-radius: 60px; padding: 0.6rem 1.5rem; font-weight: 500; color: white; font-size: 0.95rem; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; transition: 0.2s; border: 1px solid #c9a8d3; }
        .btn-primary:hover { background: #a47bae; transform: scale(0.98); }
        .btn-danger { background: #e9d4ed; border: 1px solid #d5b8dc; color: #55335e; padding: 0.3rem 0.8rem; border-radius: 40px; font-size: 0.75rem; font-weight: 500; cursor: pointer; transition: 0.15s; display: inline-flex; align-items: center; gap: 4px; }
        .btn-danger:hover { background: #dcbfe2; }

        .no-data { text-align: center; padding: 3rem; color: #9a82a2; background: #fcf8fe; border-radius: 40px; border: 1px dashed #dcc7e2; }
        .no-data i { font-size: 2.4rem; opacity: 0.5; display: block; margin-bottom: 0.5rem; }

        /* Стили для дневника учеников (старые функции) */
        .day-students-grid { display: flex; flex-direction: column; gap: 1.5rem; }
        .day-student-card { background: #fcf8fe; border-radius: 30px; padding: 1.5rem 2rem; border: 1px solid #decbe3; box-shadow: 0 6px 14px -6px rgba(130, 90, 145, 0.12); transition: 0.15s; }
        .day-student-card:hover { border-color: #cbafd3; }
        .day-student-header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 1rem 0.5rem; margin-bottom: 0.8rem; }
        .day-student-name { font-size: 1.5rem; font-weight: 450; color: #3b2740; display: flex; align-items: center; gap: 8px; }
        .day-student-name i { color: #8f6f9a; font-size: 1.3rem; }
        .day-lessons-table-wrap { overflow-x: auto; margin: 0.5rem 0 0.8rem; }
        .day-lessons-table { width: 100%; border-collapse: collapse; font-size: 0.95rem; min-width: 500px; }
        .day-lessons-table th { text-align: left; padding: 0.7rem 0.6rem 0.7rem 0; font-weight: 500; color: #5b4363; border-bottom: 1px solid #dcc7e2; }
        .day-lessons-table td { padding: 0.8rem 0.6rem 0.8rem 0; border-bottom: 1px dashed #e8d9ed; vertical-align: middle; }
        .day-lessons-table tr:last-child td { border-bottom: none; }
        .status-paid { background: #d9ebd9; color: #1f5420; padding: 0.3rem 1.2rem; border-radius: 60px; font-size: 0.85rem; font-weight: 500; display: inline-block; border: 1px solid #b8d5b8; }
        .status-unpaid { background: #f7e6e6; color: #8a4040; padding: 0.3rem 1.2rem; border-radius: 60px; font-size: 0.85rem; font-weight: 500; display: inline-block; border: 1px solid #eac8c8; }
        .note-badge { background: #efe6f2; padding: 0.3rem 1rem; border-radius: 30px; font-size: 0.85rem; color: #3f2a44; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: inline-block; border: 1px solid #dcc7e2; }

        /* Форма добавления ученика (старая) */
        .add-student-section { 
            background: #fcf8fe; 
            border-radius: 40px; 
            padding: 1.5rem 2rem; 
            margin: 1.5rem 0; 
            border: 1px solid #dcc7e2; 
            display: flex; 
            flex-wrap: wrap; 
            align-items: flex-end; 
            gap: 1rem 1.5rem; 
        }
        .add-student-section .field-group { display: flex; flex-direction: column; gap: 0.3rem; flex: 1 0 100px; }
        .add-student-section label { font-size: 0.8rem; font-weight: 500; color: #5e4166; display: flex; align-items: center; gap: 6px; }
        .add-student-section input, .add-student-section select { background: white; border: 1px solid #dcc7e2; border-radius: 40px; padding: 0.6rem 1rem; font-size: 0.9rem; color: #2e1f32; outline: none; width: 100%; }
        .add-student-section input:focus, .add-student-section select:focus { border-color: #b48dbd; box-shadow: 0 0 0 3px rgba(180, 130, 190, 0.2); }

        @media (max-width: 768px) {
            .app-container { padding: 1rem; }
            .add-slot-form, .add-student-section { flex-direction: column; align-items: stretch; }
            .calendar-nav { flex-direction: column; align-items: stretch; }
            .slots-grid { grid-template-columns: 1fr; }
            .login-card { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>
<div class="app-container" id="app">
    <!-- ЭКРАН ВХОДА -->
    <div v-if="!isLoggedIn" class="login-overlay">
        <div class="login-card">
            <h2><i class="fas fa-leaf"></i> Ученический сад</h2>
            <p class="subtitle">Войдите как репетитор или родитель</p>
            
            <div v-if="loginError" class="error">{{ loginError }}</div>
            
            <div class="role-selector">
                <button :class="{ active: selectedRole === 'tutor' }" @click="selectedRole = 'tutor'">
                    <i class="fas fa-chalkboard-teacher"></i> Репетитор
                </button>
                <button :class="{ active: selectedRole === 'parent' }" @click="selectedRole = 'parent'">
                    <i class="fas fa-user-friends"></i> Родитель
                </button>
            </div>
            
            <div v-if="!showRegister">
                <div class="field-group">
                    <label><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" v-model="loginEmail" placeholder="your@email.com" @keydown.enter="login">
                </div>
                <div class="field-group">
                    <label><i class="fas fa-lock"></i> Пароль</label>
                    <input type="password" v-model="loginPassword" placeholder="••••••••" @keydown.enter="login">
                </div>
                <button class="btn-primary" @click="login"><i class="fas fa-sign-in-alt"></i> Войти</button>
                <div style="margin-top: 1rem;">
                    <button class="btn-secondary" @click="showRegister = !showRegister">
                        <i class="fas fa-user-plus"></i> Нет аккаунта? Зарегистрироваться
                    </button>
                </div>
            </div>
            
            <div v-else>
                <div class="field-group">
                    <label><i class="fas fa-user"></i> Ваше имя</label>
                    <input type="text" v-model="registerName" placeholder="Анна" @keydown.enter="register">
                </div>
                <div class="field-group">
                    <label><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" v-model="registerEmail" placeholder="your@email.com" @keydown.enter="register">
                </div>
                <div class="field-group">
                    <label><i class="fas fa-lock"></i> Пароль (мин. 6 символов)</label>
                    <input type="password" v-model="registerPassword" placeholder="••••••••" @keydown.enter="register">
                </div>
                <div class="field-group">
                    <label><i class="fas fa-user-tag"></i> Кто вы?</label>
                    <select v-model="selectedRole" style="width:100%;padding:0.8rem 1.2rem;border-radius:60px;border:1px solid #dcc7e2;font-size:1rem;outline:none;background:white;">
                        <option value="tutor">👩‍🏫 Репетитор</option>
                        <option value="parent">👨‍👩‍👦 Родитель</option>
                    </select>
                </div>
                <button class="btn-primary" @click="register" style="background:#a47bae;"><i class="fas fa-user-plus"></i> Зарегистрироваться</button>
                <div style="margin-top: 0.8rem;">
                    <button class="btn-secondary" @click="showRegister = !showRegister">
                        <i class="fas fa-arrow-left"></i> Назад к входу
                    </button>
                </div>
            </div>
            
            <div class="hint">
                <i class="fas fa-cloud-upload-alt"></i> Данные сохраняются в облаке
            </div>
        </div>
    </div>

    <!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
    <template v-if="isLoggedIn">
        <div class="header-botanical">
            <h1><i class="fas fa-leaf"></i> ученический сад</h1>
            <span class="botanical-icon">
                <i class="fas fa-user-circle"></i> {{ userEmail }}
                <span class="role-badge" :class="{ parent: userRole === 'parent' }">
                    {{ userRole === 'tutor' ? '👩‍🏫 Репетитор' : '👨‍👩‍👦 Родитель' }}
                </span>
                <button class="btn-circle" @click="logout" style="width:auto;padding:0 0.8rem;font-size:0.8rem;background:#e9d4ed;border-color:#d5b8dc;">
                    <i class="fas fa-sign-out-alt"></i> Выйти
                </button>
            </span>
        </div>

        <!-- ===== ВКЛАДКИ ДЛЯ РЕПЕТИТОРА ===== -->
        <div v-if="userRole === 'tutor'" class="tabs">
            <button class="tab-btn" :class="{ active: viewMode === 'slots' }" @click="viewMode = 'slots'">
                <i class="fas fa-clock"></i> Слоты для родителей
            </button>
            <button class="tab-btn" :class="{ active: viewMode === 'students' }" @click="viewMode = 'students'">
                <i class="fas fa-users"></i> Мои ученики
            </button>
            <button class="tab-btn" :class="{ active: viewMode === 'diary' }" @click="viewMode = 'diary'">
                <i class="fas fa-book"></i> Дневник занятий
            </button>
            <button class="tab-btn" :class="{ active: viewMode === 'calendar' }" @click="viewMode = 'calendar'">
                <i class="fas fa-calendar-alt"></i> Календарь
            </button>
        </div>

        <!-- ===== ВКЛАДКИ ДЛЯ РОДИТЕЛЯ ===== -->
        <div v-else class="tabs">
            <button class="tab-btn" :class="{ active: viewMode === 'slots' }" @click="viewMode = 'slots'">
                <i class="fas fa-clock"></i> Свободные слоты
            </button>
            <button class="tab-btn" :class="{ active: viewMode === 'mybookings' }" @click="viewMode = 'mybookings'">
                <i class="fas fa-calendar-check"></i> Мои записи
            </button>
        </div>

        <!-- ============================================ -->
        <!-- ===== РЕЖИМ РЕПЕТИТОРА ===== -->
        <!-- ============================================ -->
        <template v-if="userRole === 'tutor'">
            
            <!-- 1. СЛОТЫ ДЛЯ РОДИТЕЛЕЙ -->
            <div v-if="viewMode === 'slots'">
                <div class="add-slot-form">
                    <div class="field-group">
                        <label><i class="fas fa-calendar-day"></i> Дата</label>
                        <input type="date" v-model="newSlotDate">
                    </div>
                    <div class="field-group">
                        <label><i class="far fa-clock"></i> Время</label>
                        <input type="text" v-model="newSlotTime" placeholder="15:00–16:30">
                    </div>
                    <div class="field-group">
                        <label><i class="fas fa-coins"></i> Стоимость</label>
                        <input type="text" v-model="newSlotPrice" placeholder="1500 ₽">
                    </div>
                    <button class="btn-primary" @click="addSlot"><i class="fas fa-plus-circle"></i> Добавить слот</button>
                </div>

                <div class="slots-grid" v-if="tutorSlots.length > 0">
                    <div v-for="slot in tutorSlots" :key="slot.id" class="slot-card" :class="{ booked: slot.booked }">
                        <div class="time">{{ slot.time }}</div>
                        <div>{{ slot.date }}</div>
                        <div style="font-weight:500;">{{ slot.price }}</div>
                        <span class="status" :class="{ free: !slot.booked, booked: slot.booked }">
                            {{ slot.booked ? '📕 Занято' : '📗 Свободно' }}
                        </span>
                        <div v-if="slot.booked && slot.student" class="student-info">
                            <div><strong>👤 {{ slot.student.name }}</strong></div>
                            <div>{{ slot.student.class || '' }}</div>
                            <div>📞 {{ slot.student.phone || '' }}</div>
                        </div>
                        <div class="actions">
                            <button v-if="!slot.booked" class="btn-delete" @click="deleteSlot(slot.id)">
                                <i class="fas fa-trash"></i> Удалить
                            </button>
                            <button v-if="slot.booked" class="btn-cancel" @click="cancelBooking(slot.id)">
                                <i class="fas fa-times"></i> Отменить запись
                            </button>
                        </div>
                    </div>
                </div>
                <div v-else class="no-data">
                    <i class="fas fa-clock"></i>
                    <p>Нет созданных слотов</p>
                </div>
            </div>

            <!-- 2. МОИ УЧЕНИКИ (из записей) -->
            <div v-if="viewMode === 'students'">
                <div class="slots-grid" v-if="myStudents.length > 0">
                    <div v-for="student in myStudents" :key="student.name + student.phone" class="slot-card">
                        <div style="font-size:1.2rem;font-weight:500;">
                            <i class="fas fa-user-circle"></i> {{ student.name }}
                        </div>
                        <div>📞 {{ student.phone || '—' }}</div>
                        <div>🏫 {{ student.class || '—' }}</div>
                        <div style="margin-top:0.5rem;font-size:0.9rem;color:#6a4e72;">
                            Всего занятий: {{ student.totalLessons || 0 }}
                        </div>
                    </div>
                </div>
                <div v-else class="no-data">
                    <i class="fas fa-users"></i>
                    <p>Пока нет учеников</p>
                </div>
            </div>

            <!-- 3. ДНЕВНИК ЗАНЯТИЙ (старые функции) -->
            <div v-if="viewMode === 'diary'">
                <!-- Форма добавления занятия -->
                <div class="add-student-section">
                    <div class="field-group"><label><i class="fas fa-user-graduate"></i> Ученик</label><input v-model="newStudentName" placeholder="Имя"></div>

                <div class="slots-grid">

            <!-- Мои записи -->
            <div v-if="viewMode === 'mybookings'">
                <div class="slots-grid" v-if="myBookings.length > 0">
                    <div v-for="booking in myBookings" :key="booking.id" class="slot-card" :class="{ booked: true }">
                        <div class="time">{{ booking.slot?.time || '—' }}</div>
                        <div>{{ booking.slot?.date || '—' }}</div>

                        <div class="student-info">

                                <i class="fas fa-times"></i> Отменить запись

                <div v-else class="no-data">

<script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
<script>
    // ==========================================
    // ⭐ ВСТАВЬТЕ ВАШИ ДАННЫЕ СЮДА ⭐
    // ==========================================
    const SUPABASE_URL = 'https://nmvsdljxxwghwpmjnoxh.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_TexxaSVrxSpUXBh0tIR7Tw_6-Sdlsm_';
    // ==========================================

    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    new Vue({
        el: '#app',
        data: {
            isLoggedIn: false,
            userEmail: '',
            userRole: 'parent',
            selectedRole: 'tutor',
            loginEmail: '',
            loginPassword: '',
            loginError: '',
            showRegister: false,
            registerName: '',
            registerEmail: '',
            registerPassword: '',
            
            // Данные для слотов
            slots: [],
            tutorSlots: [],
            freeSlots: [],
            myBookings: [],
            myStudents: [],
            
            // Данные для дневника (старые функции)
            diaryStudents: [],
            diaryLessons: [],
            students: [],
            
            viewMode: 'slots',
            currentDate: new Date(),
            
            // Форма добавления слота
            newSlotDate: '',
            newSlotTime: '',
            newSlotPrice: '',
            
            // Форма добавления занятия в дневник
            newStudentName: '',
            newLessonDate: '',
            newLessonTime: '',
            newLessonPrice: '',
            newLessonPaid: 'paid',
            newLessonNote: '',
            
            monthDays: []
        },
        computed: {
            currentMonth() {
                return ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'][this.currentDate.getMonth()];
            },
            currentYear() {
                return this.currentDate.getFullYear();
            },
            formattedSelectedDate() {
                const d = this.currentDate; 
                return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;
            },
            selectedDateStr() {
                const d = this.currentDate; 
                return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            }
        },
        methods: {
            formatDate(date) {
                return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
            },
            
            // ===== АВТОРИЗАЦИЯ =====
            async login() {
                this.loginError = '';
                if (!this.loginEmail || !this.loginPassword) {
                    this.loginError = 'Введите email и пароль';
                    return;
                }
                try {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({
                        email: this.loginEmail,
                        password: this.loginPassword
                    });
                    if (error) throw error;
                    
                    const { data: userData, error: userError } = await supabaseClient
                        .from('users')
                        .select('role')
                        .eq('id', data.user.id)
                        .maybeSingle();
                    
                    if (userError || !userData) {
                        const defaultRole = this.selectedRole === 'tutor' ? 'tutor' : 'parent';
                        await supabaseClient
                            .from('users')
                            .insert({
                                id: data.user.id,
                                email: data.user.email,
                                name: data.user.user_metadata?.name || 'Пользователь',
                                role: defaultRole
                            });
                        this.userRole = defaultRole;
                    } else {
                        this.userRole = userData.role || 'parent';
                    }
                    
                    if (this.userRole !== this.selectedRole) {
                        await supabaseClient
                            .from('users')
                            .update({ role: this.selectedRole })
                            .eq('id', data.user.id);
                        this.userRole = this.selectedRole;
                    }
                    
                    this.userEmail = data.user.email;
                    this.isLoggedIn = true;
                    this.loginEmail = '';
                    this.loginPassword = '';
                    this.loginError = '';
                    
                    await this.loadData();
                } catch (e) {
                    console.error('Ошибка входа:', e);
                    this.loginError = e.message || 'Ошибка входа. Проверьте email и пароль.';
                }
            },
            
            async register() {
                this.loginError = '';
                if (!this.registerEmail || !this.registerPassword || !this.registerName) {
                    this.loginError = 'Заполните все поля';
                    return;
                }
                if (this.registerPassword.length < 6) {
                    this.loginError = 'Пароль должен быть минимум 6 символов';
                    return;
                }
                try {
                    const { data, error } = await supabaseClient.auth.signUp({
                        email: this.registerEmail,
                        password: this.registerPassword,
                        options: {
                            data: { 
                                name: this.registerName,
                                role: this.selectedRole 
                            }
                        }
                    });
                    if (error) throw error;
                    
                    if (data.user) {
                        await supabaseClient
                            .from('users')
                            .insert({
                                id: data.user.id,
                                email: this.registerEmail,
                                name: this.registerName,
                                role: this.selectedRole
                            });
                    }
                    
                    alert(`✅ Регистрация успешна! Вы зарегистрированы как ${this.selectedRole === 'tutor' ? 'репетитор' : 'родитель'}. Проверьте почту для подтверждения.`);
                    this.showRegister = false;
                    this.registerName = '';
                    this.registerEmail = '';
                    this.registerPassword = '';
                    this.loginEmail = this.registerEmail;
                    this.loginError = '✅ Теперь войдите с вашим email и паролем.';
                } catch (e) {
                    console.error('Ошибка регистрации:', e);
                    this.loginError = e.message || 'Ошибка регистрации.';
                }
            },
            
            async logout() {
                await supabaseClient.auth.signOut();
                this.isLoggedIn = false;
                this.userEmail = '';
                this.userRole = '';
                this.tutorSlots = [];
                this.freeSlots = [];
                this.myBookings = [];
                this.myStudents = [];
                this.diaryStudents = [];
                this.diaryLessons = [];
            },
            
            // ===== ЗАГРУЗКА ДАННЫХ =====
            async loadData() {
                console.log('Загрузка данных для роли:', this.userRole);
                if (this.userRole === 'tutor') {
                    await this.loadTutorSlots();
                    await this.loadStudents();
                    await this.loadDiary();
                    this.viewMode = 'slots';
                } else {
                    await this.loadFreeSlots();
                    await this.loadMyBookings();
                    this.viewMode = 'slots';
                }
            },
            
            async loadTutorSlots() {
                try {
                    const user = await supabaseClient.auth.getUser();
                    const { data, error } = await supabaseClient
                        .from('slots')
                        .select('*')
                        .eq('tutor_id', user.data.user.id)
                        .order('date', { ascending: true });
                    
                    if (error) throw error;
                    this.tutorSlots = data || [];
                } catch (e) {
                    console.error('Ошибка загрузки слотов:', e);
                }
            },
            
            async loadStudents() {
                try {
                    const user = await supabaseClient.auth.getUser();
                    const { data, error } = await supabaseClient
                        .from('bookings')
                        .select('student_name, student_class, student_phone, created_at')
                        .eq('tutor_id', user.data.user.id)
                        .order('created_at', { ascending: false });
                    
                    if (error) throw error;
                    
                    const studentsMap = new Map();
                    (data || []).forEach(b => {
                        const key = b.student_name + b.student_phone;
                        if (!studentsMap.has(key)) {
                            studentsMap.set(key, {
                                name: b.student_name,
                                phone: b.student_phone || '—',
                                class: b.student_class || '—',
                                totalLessons: 0
                            });
                        }
                        studentsMap.get(key).totalLessons++;
                    });
                    this.myStudents = Array.from(studentsMap.values());
                } catch (e) {
                    console.error('Ошибка загрузки учеников:', e);
                }
            },
            
            // ===== ЗАГРУЗКА ДНЕВНИКА (старые функции) =====
            async loadDiary() {
                try {
                    const user = await supabaseClient.auth.getUser();
                    // Загружаем все занятия из дневника
                    const { data, error } = await supabaseClient
                        .from('diary_lessons')
                        .select('*')
                        .eq('tutor_id', user.data.user.id)
                        .order('date', { ascending: false });
                    
                    if (error) throw error;
                    
                    // Группируем по ученикам и датам для отображения
                    const lessons = data || [];
                    this.diaryLessons = lessons;
                    
                    // Фильтруем для отображения на выбранную дату
                    const filtered = lessons.filter(l => l.date === this.selectedDateStr);
                    const result = [];
                    const studentsMap = new Map();
                    
                    filtered.forEach(l => {
                        if (!studentsMap.has(l.student_name)) {
                            studentsMap.set(l.student_name, {
                                name: l.student_name,
                                lessons: []
                            });
                        }
                        studentsMap.get(l.student_name).lessons.push(l);
                    });
                    
                    this.diaryStudents = Array.from(studentsMap.values()).map(s => ({
                        ...s,
                        originalIndex: this.diaryStudents.findIndex(d => d.name === s.name) || 0
                    }));
                    
                } catch (e) {
                    console.error('Ошибка загрузки дневника:', e);
                }
            },
            
            async loadFreeSlots() {
                try {
                    const today = this.formatDate(new Date());
                    const { data, error } = await supabaseClient
                        .from('slots')
                        .select('*')
                        .eq('booked', false)
                        .gte('date', today)
                        .order('date', { ascending: true });
                    
                    if (error) throw error;
                    
                    this.freeSlots = (data || []).map(s => ({
                        ...s,
                        showBookingForm: false,
                        bookForm: { name: '', class: '', phone: '' }
                    }));
                } catch (e) {
                    console.error('Ошибка загрузки свободных слотов:', e);
                }
            },
            
            async loadMyBookings() {
                try {
                    const user = await supabaseClient.auth.getUser();
                    const { data, error } = await supabaseClient
                        .from('bookings')
                        .select('*, slot:slots(*)')
                        .eq('parent_id', user.data.user.id)
                        .order('created_at', { ascending: false });
                    
                    if (error) throw error;
                    this.myBookings = data || [];
                } catch (e) {
                    console.error('Ошибка загрузки записей:', e);
                }
            },
            
            // ===== УПРАВЛЕНИЕ СЛОТАМИ =====
            async addSlot() {
                if (!this.newSlotDate || !this.newSlotTime || !this.newSlotPrice) {
                    alert('Заполните все поля');
                    return;
                }
                const user = await supabaseClient.auth.getUser();
                const { error } = await supabaseClient
                    .from('slots')
                    .insert({
                        tutor_id: user.data.user.id,
                        date: this.newSlotDate,
                        time: this.newSlotTime,
                        price: this.newSlotPrice,
                        booked: false
                    });
                if (error) {
                    alert('Ошибка: ' + error.message);
                } else {
                    this.newSlotDate = '';
                    this.newSlotTime = '';
                    this.newSlotPrice = '';
                    await this.loadTutorSlots();
                }
            },
            
            async deleteSlot(slotId) {
                if (confirm('Удалить этот слот?')) {
                    await supabaseClient
                        .from('slots')
                        .delete()
                        .eq('id', slotId);
                    await this.loadTutorSlots();
                }
            },
            
            async cancelBooking(slotId) {
                if (confirm('Отменить запись на этот слот?')) {
                    await supabaseClient
                        .from('bookings')
                        .delete()
                        .eq('slot_id', slotId);
                    
                    await supabaseClient
                        .from('slots')
                        .update({ booked: false, student: null })
                        .eq('id', slotId);
                    
                    await this.loadTutorSlots();
                }
            },
            
            // ===== ЗАПИСЬ РОДИТЕЛЯ =====
            async bookSlot(slot) {
                const form = slot.bookForm;
                if (!form.name || !form.phone) {
                    alert('Заполните имя и телефон');
                    return;
                }
                const user = await supabaseClient.auth.getUser();
                
                const { error } = await supabaseClient
                    .from('bookings')
                    .insert({
                        slot_id: slot.id,
                        parent_id: user.data.user.id,
                        tutor_id: slot.tutor_id,
                        student_name: form.name,
                        student_class: form.class || '',
                        student_phone: form.phone
                    });
                
                if (error) {
                    alert('Ошибка записи: ' + error.message);
                    return;
                }
                
                await supabaseClient
                    .from('slots')
                    .update({ 
                        booked: true, 
                        student: { 
                            name: form.name, 
                            class: form.class || '', 
                            phone: form.phone 
                        } 
                    })
                    .eq('id', slot.id);
                
                await this.loadFreeSlots();
                await this.loadMyBookings();
                alert('✅ Вы успешно записались!');
            },
            
            async cancelMyBooking(bookingId) {
                if (confirm('Отменить запись?')) {
                    const booking = this.myBookings.find(b => b.id === bookingId);
                    if (booking) {
                        await supabaseClient
                            .from('slots')
                            .update({ booked: false, student: null })
                            .eq('id', booking.slot_id);
                    }
                    
                    await supabaseClient
                        .from('bookings')
                        .delete()
                        .eq('id', bookingId);
                    
                    await this.loadMyBookings();
                    await this.loadFreeSlots();
                }
            },
            
            // ===== ДНЕВНИК (старые функции) =====
            async addDiaryLesson() {
                const name = this.newStudentName.trim(), 
                      date = this.newLessonDate.trim(), 
                      time = this.newLessonTime.trim(), 
                      price = this.newLessonPrice.trim(), 
                      note = this.newLessonNote.trim();
                if (!name || !date || !time || !price) { 
                    alert('Заполните имя, дату, время и стоимость.'); 
                    return; 
                }
                
                const user = await supabaseClient.auth.getUser();
                const { error } = await supabaseClient
                    .from('diary_lessons')
                    .insert({
                        tutor_id: user.data.user.id,
                        student_name: name,
                        date: date,
                        time: time,
                        price: price,
                        paid: this.newLessonPaid,
                        note: note || ''
                    });
                
                if (error) {
                    alert('Ошибка: ' + error.message);
                    return;
                }
                
                this.newStudentName = '';
                this.newLessonDate = '';
                this.newLessonTime = '';
                this.newLessonPrice = '';
                this.newLessonPaid = 'paid';
                this.newLessonNote = '';
                
                await this.loadDiary();
            },
            
            async removeDiaryLesson(studentIdx, lessonIdx) {
                const student = this.diaryStudents[studentIdx];
                if (!student) return;
                const lesson = student.lessons[lessonIdx];
                if (!lesson) return;
                
                if (confirm('Удалить это занятие?')) {
                    await supabaseClient
                        .from('diary_lessons')
                        .delete()
                        .eq('id', lesson.id);
                    
                    await this.loadDiary();
                }
            },
            
            async togglePaid(studentIdx, lessonIdx) {
                const student = this.diaryStudents[studentIdx];
                if (!student) return;
                const lesson = student.lessons[lessonIdx];
                if (!lesson) return;
                
                const newStatus = lesson.paid === 'paid' ? 'unpaid' : 'paid';
                await supabaseClient
                    .from('diary_lessons')
                    .update({ paid: newStatus })
                    .eq('id', lesson.id);
                
                await this.loadDiary();
            },
            
            async removeStudent(studentIdx) {
                const student = this.diaryStudents[studentIdx];
                if (!student) return;
                if (confirm(`Удалить все занятия ученика "${student.name}"?`)) {
                    // Удаляем все занятия этого ученика
                    const lessons = this.diaryLessons.filter(l => l.student_name === student.name);
                    for (const lesson of lessons) {
                        await supabaseClient
                            .from('diary_lessons')
                            .delete()
                            .eq('id', lesson.id);
                    }
                    await this.loadDiary();
                }
            },
            
            // ===== КАЛЕНДАРЬ =====
            changeMonth(delta) {
                const newDate = new Date(this.currentDate);
                newDate.setMonth(newDate.getMonth() + delta);
                this.currentDate = newDate;
                this.buildCalendar();
            },
            
            goToday() {
                this.currentDate = new Date();
                this.buildCalendar();
            },
            
            async buildCalendar() {
                const year = this.currentDate.getFullYear();
                const month = this.currentDate.getMonth();
                const lastDay = new Date(year, month + 1, 0);
                
                const days = [];
                for (let d = 1; d <= lastDay.getDate(); d++) {
                    const date = new Date(year, month, d);
                    const dateStr = this.formatDate(date);
                    const slots = this.tutorSlots.filter(s => s.date === dateStr);
                    days.push({
                        date: dateStr,
                        dayNum: d,
                        weekday: ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][date.getDay()],
                        isCurrentMonth: true,
                        slots: slots
                    });
                }
                this.monthDays = days;
            }
        },
        
        async mounted() {
            // Проверяем сессию
            const { data } = await supabaseClient.auth.getSession();
            if (data.session) {
                const { data: userData, error } = await supabaseClient
                    .from('users')
                    .select('role')
                    .eq('id', data.session.user.id)
                    .maybeSingle();
                
                if (error) {
                    console.error('Ошибка получения роли:', error);
                }
                
                this.userRole = userData?.role || 'parent';
                this.userEmail = data.session.user.email;
                this.isLoggedIn = true;
                await this.loadData();
                if (this.userRole === 'tutor') {
                    await this.buildCalendar();
                }
                console.log('🔄 Загружена роль при монтировании:', this.userRole);
            }
            
            // Слушаем изменения сессии
            supabaseClient.auth.onAuthStateChange(async (event, session) => {
                if (event === 'SIGNED_IN' && session) {
                    this.userEmail = session.user.email;
                    this.isLoggedIn = true;
                    
                    const { data: userData } = await supabaseClient
                        .from('users')
                        .select('role')
                        .eq('id', session.user.id)
                        .maybeSingle();
                    
                    this.userRole = userData?.role || 'parent';
                    await this.loadData();
                }
                if (event === 'SIGNED_OUT') {
                    this.isLoggedIn = false;
                    this.userEmail = '';
                    this.userRole = '';
                    this.tutorSlots = [];
                    this.freeSlots = [];
                    this.myBookings = [];
                    this.diaryStudents = [];
                    this.diaryLessons = [];
                }
            });
            
            // Устанавливаем сегодняшнюю дату для форм
            const today = new Date();
            this.newSlotDate = this.formatDate(today);
            this.newLessonDate = this.formatDate(today);
        }
    });
</script>
</body>
</html>
