<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Репетитор · ученический сад</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif; }
        body { background: #f8f3fa; min-height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; padding: 20px; }
        
        .app-container { 
            max-width: 1400px; 
            width: 100%; 
            background: rgba(255, 250, 252, 0.7); 
            backdrop-filter: blur(2px); 
            border-radius: 48px; 
            padding: 2rem; 
            box-shadow: 0 20px 40px -12px rgba(120, 80, 130, 0.25); 
            border: 1px solid #e5d5e9; 
        }
        
        .login-overlay { 
            position: fixed; 
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(60, 40, 70, 0.7); 
            backdrop-filter: blur(8px); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            z-index: 9999; 
            padding: 20px;
        }
        .login-card { 
            background: #fcf8fe; 
            border-radius: 60px; 
            padding: 2.5rem;

            width: 100%; 
            border: 1px solid #dcc7e2;

        .login-card .field-group { margin-bottom: 1rem; text-align: left; }

        .login-card input, .login-card select {

            padding: 0.8rem 1.2rem; 
            border-radius: 60px; 
            border: 1px solid #dcc7e2; 
            font-size: 1rem; 
            outline: none; 
            background: white;
        }
        .login-card input:focus, .login-card select:focus { border-color: #b48dbd; box-shadow: 0 0 0 3px rgba(180, 130, 190, 0.2); }
        .login-card .btn-primary { 
            width: 100%; 
            padding: 0.8rem; 
            font-size: 1rem; 
            background: #b48dbd;
            border: none;
            border-radius: 60px;
            font-weight: 500;
            color: white;

        .login-card .btn-secondary {

            border: none; 
            color: #7f5f89;

            font-size: 0.9rem; 
            padding: 0.5rem;

        .login-card .error {

            border-radius: 30px; 
            font-size: 0.9rem; 
            margin-bottom: 1rem; 
        }
        .login-card .role-selector { 
            display: flex;

        }

            margin-top: 1.5rem;

        .role-badge {

        .btn-circle { background: #efe6f2; border: 1px solid #d5bedb; border-radius: 60px; width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; color: #553a5c; font-size: 1rem; cursor: pointer; transition: 0.15s; }
        .btn-circle:hover { background: #dcc7e2; border-color: #b48dbd; }
        .btn-circle.today-btn { background: #b48dbd; color: white; border-color: #b48dbd; width: auto; padding: 0 1.2rem; font-weight: 500; font-size: 0.85rem; }

        .btn-circle.copy-btn { background: #d9ebd9; border-color: #b8d5b8; color: #1f5420; width: auto; padding: 0 1.2rem; font-weight: 500; font-size: 0.85rem; }
        .btn-circle.copy-btn:hover { background: #c5e0c5; }

        .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .tab-btn { background: #efe6f2; border: 1px solid #d5bedb; border-radius: 60px; padding: 0.5rem 1.5rem; font-weight: 500; color: #553a5c; cursor: pointer; transition: 0.15s; font-size: 0.95rem; }
        .tab-btn:hover { background: #dcc7e2; }
        .tab-btn.active { background: #b48dbd; color: white; border-color: #b48dbd; }

        .calendar-nav { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; background: #fcf8fe; border-radius: 60px; padding: 0.6rem 1.5rem; margin-bottom: 1.5rem; border: 1px solid #dcc7e2; }

            border-radius: 20px; 
            font-size: 0.9rem;

        .slot-card .actions { margin-top: 0.8rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .slot-card .actions button {

            border: none; 
            cursor: pointer; 
            font-size: 0.8rem; 
            font-weight: 500;

        .slot-card .actions .btn-book { background: #b48dbd; color: white; }
        .slot-card .actions .btn-book:hover { background: #a47bae; }
        .slot-card .actions .btn-cancel { background: #e9d4ed; color: #55335e; }
        .slot-card .actions .btn-cancel:hover { background: #dcbfe2; }
        .slot-card .actions .btn-delete { background: #f7e6e6; color: #8a4040; }
        .slot-card .actions .btn-delete:hover { background: #eac8c8; }

        .add-slot-form { 
            background: #fcf8fe; 
            border-radius: 40px; 
            padding: 1.5rem 2rem; 
            margin: 1.5rem 0; 
            border: 1px solid #dcc7e2; 
            display: flex; 
            flex-wrap: wrap; 
            align-items: flex-end; 
            gap: 1rem 1.5rem; 
        }
        .add-slot-form .field-group { display: flex; flex-direction: column; gap: 0.3rem; flex: 1 0 120px; }
        .add-slot-form label { font-size: 0.8rem; font-weight: 500; color: #5e4166; }
        .add-slot-form input { background: white; border: 1px solid #dcc7e2; border-radius: 40px; padding: 0.6rem 1rem; font-size: 0.9rem; outline: none; width: 100%; }
        .add-slot-form input:focus { border-color: #b48dbd; }

        .btn-primary { background: #b48dbd; border: none; border-radius: 60px; padding: 0.6rem 1.5rem; font-weight: 500; color: white; font-size: 0.95rem; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; transition: 0.2s; border: 1px solid #c9a8d3; }
        .btn-primary:hover { background: #a47bae; transform: scale(0.98); }
        .btn-danger { background: #e9d4ed; border: 1px solid #d5b8dc; color: #55335e; padding: 0.3rem 0.8rem; border-radius: 40px; font-size: 0.75rem; font-weight: 500; cursor: pointer; transition: 0.15s; display: inline-flex; align-items: center; gap: 4px; }
        .btn-danger:hover { background: #dcbfe2; }

        .btn-icon:hover { color: #4a2e4f; }

        .no-data i { font-size: 2.4rem; opacity: 0.5; display: block; margin-bottom: 0.5rem; }

        .day-students-grid { display: flex; flex-direction: column; gap: 1.5rem; }
        .day-student-card { background: #fcf8fe; border-radius: 30px; padding: 1.5rem 2rem; border: 1px solid #decbe3; box-shadow: 0 6px 14px -6px rgba(130, 90, 145, 0.12); transition: 0.15s; }
        .day-student-card:hover { border-color: #cbafd3; }
        .day-student-header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 1rem 0.5rem; margin-bottom: 0.8rem; }
        .day-student-name { font-size: 1.5rem; font-weight: 450; color: #3b2740; display: flex; align-items: center; gap: 8px; }
        .day-student-name i { color: #8f6f9a; font-size: 1.3rem; }
        .day-lessons-table-wrap { overflow-x: auto; margin: 0.5rem 0 0.8rem; }
        .day-lessons-table { width: 100%; border-collapse: collapse; font-size: 0.95rem; min-width: 600px; }
        .day-lessons-table th { text-align: left; padding: 0.7rem 0.6rem 0.7rem 0; font-weight: 500; color: #5b4363; border-bottom: 1px solid #dcc7e2; }
        .day-lessons-table td { padding: 0.8rem 0.6rem 0.8rem 0; border-bottom: 1px dashed #e8d9ed; vertical-align: middle; }
        .day-lessons-table tr:last-child td { border-bottom: none; }
        .status-paid { background: #d9ebd9; color: #1f5420; padding: 0.3rem 1.2rem; border-radius: 60px; font-size: 0.85rem; font-weight: 500; display: inline-block; border: 1px solid #b8d5b8; }
        .status-unpaid { background: #f7e6e6; color: #8a4040; padding: 0.3rem 1.2rem; border-radius: 60px; font-size: 0.85rem; font-weight: 500; display: inline-block; border: 1px solid #eac8c8; }
        .note-badge { 
            background: #efe6f2; 
            padding: 0.3rem 1rem; 
            border-radius: 30px; 
            font-size: 0.85rem; 
            color: #3f2a44; 
            max-width: 200px; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            display: inline-block; 
            border: 1px solid #dcc7e2; 
        }
        .source-badge { 
            font-size: 0.65rem; 
            padding: 0.15rem 0.6rem; 
            border-radius: 30px; 
            background: #c9d4e8; 
            color: #2e3f5a; 
            display: inline-block;
            margin-left: 0.3rem;
        }
        .source-badge.parent { background: #d9ebd9; color: #1f5420; }
        .source-badge.tutor { background: #c9d4e8; color: #2e3f5a; }

        .add-student-section { 
            background: #fcf8fe; 
            border-radius: 40px; 
            padding: 1.5rem 2rem; 
            margin: 1.5rem 0; 
            border: 1px solid #dcc7e2; 
            display: flex; 
            flex-wrap: wrap; 
            align-items: flex-end; 
            gap: 1rem 1.5rem; 
        }
        .add-student-section .field-group { display: flex; flex-direction: column; gap: 0.3rem; flex: 1 0 100px; }
        .add-student-section label { font-size: 0.8rem; font-weight: 500; color: #5e4166; display: flex; align-items: center; gap: 6px; }
        .add-student-section input, .add-student-section select { background: white; border: 1px solid #dcc7e2; border-radius: 40px; padding: 0.6rem 1rem; font-size: 0.9rem; color: #2e1f32; outline: none; width: 100%; }
        .add-student-section input:focus, .add-student-section select:focus { border-color: #b48dbd; box-shadow: 0 0 0 3px rgba(180, 130, 190, 0.2); }

        .week-grid, .month-grid { display: grid; gap: 0.8rem; margin-top: 1rem; }
        .week-grid { grid-template-columns: repeat(7, 1fr); }
        .month-grid { grid-template-columns: repeat(7, 1fr); }
        .day-cell { background: #fcf8fe; border-radius: 20px; padding: 0.8rem; border: 1px solid #decbe3; min-height: 120px; transition: 0.15s; }
        .day-cell:hover { border-color: #cbafd3; box-shadow: 0 4px 12px -6px rgba(140, 100, 160, 0.12); }
        .day-cell.today { border-color: #b48dbd; background: #faf5fc; box-shadow: 0 0 0 2px rgba(180, 130, 190, 0.2); }
        .day-cell.other-month { opacity: 0.5; }
        .day-header { display: flex; justify-content: space-between; align-items: center; font-weight: 500; color: #4a2e4f; margin-bottom: 0.5rem; font-size: 0.9rem; }
        .day-header .day-num { font-size: 1.1rem; }
        .day-header .day-name { font-size: 0.75rem; color: #7f5f89; }
        .day-lesson { background: #efe6f2; border-radius: 12px; padding: 0.3rem 0.6rem; margin-bottom: 0.3rem; font-size: 0.75rem; border-left: 3px solid #b48dbd; }
        .day-lesson .student-name { font-weight: 500; color: #3b2740; }
        .day-lesson .time { color: #6a4e72; font-size: 0.7rem; }
        .day-lesson .price { color: #5e4166; font-size: 0.7rem; }
        .day-lesson .paid-badge { font-size: 0.6rem; padding: 0.1rem 0.4rem; border-radius: 20px; background: #d9ebd9; color: #1f5420; margin-left: 4px; }

        .day-lesson .note-text { font-size: 0.6rem; color: #6a4e72; }
        .day-lesson .source-badge-small {

            color: #2e3f5a;

        .day-lesson-actions { 
            margin-top: 0.3rem;

            flex-wrap: wrap; 
        }
        .day-lesson-actions button { 
            padding: 0.1rem 0.5rem; 
            border-radius: 30px; 
            border: none; 
            font-size: 0.6rem; 
            cursor: pointer; 
            font-weight: 500;
            transition: 0.15s;
        }
        .day-lesson-actions .btn-toggle-paid {

        }

        .add-mini { background: transparent; border: 1px dashed #d5bedb; border-radius: 12px; padding: 0.2rem; text-align: center; color: #9a82a2; font-size: 0.7rem; cursor: pointer; margin-top: 0.3rem; transition: 0.1s; }
        .add-mini:hover { background: #efe6f2; border-color: #b48dbd; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(60, 40, 70, 0.5); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal-content { background: #fcf8fe; border-radius: 40px; padding: 2rem 2.5rem; max-width: 500px; width: 100%; border: 1px solid #dcc7e2; box-shadow: 0 20px 40px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; }

        .modal-actions .btn-secondary { background: #efe6f2; border: 1px solid #d5bedb; border-radius: 40px; padding: 0.5rem 1.5rem; cursor: pointer; }
        .modal-actions .btn-secondary:hover { background: #dcc7e2; }

        .cancel-error {

            color: #8a4040; 
            padding: 0.5rem 1rem;

            font-size: 0.85rem; 
            margin-top: 0.5rem;

        }
        .edit-student-form .edit-actions .btn-save:hover {
            background: #a47bae;
        }
        .edit-student-form .edit-actions .btn-cancel-edit {
            background: #e9d4ed;
            color: #55335e;
        }
        .edit-student-form .edit-actions .btn-cancel-edit:hover {
            background: #dcbfe2;
        }

        .saved-data-badge {
            background: #efe6f2;
            border: 1px solid #dcc7e2;
            border-radius: 30px;
            padding: 0.3rem 1rem;
            font-size: 0.8rem;
            color: #5e4166;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 0.5rem;
        }
        .saved-data-badge i {
            color: #7d5f86;
        }
        .btn-change-child {
            background: transparent;
            border: 1px solid #d5bedb;
            border-radius: 30px;
            padding: 0.2rem 0.8rem;
            font-size: 0.7rem;
            color: #553a5c;
            cursor: pointer;
            transition: 0.15s;
            margin-left: 0.5rem;
        }
        .btn-change-child:hover {
            background: #efe6f2;
            border-color: #b48dbd;
        }

        @media (max-width: 768px) {
            .app-container { padding: 1rem; }
            .add-slot-form, .add-student-section { flex-direction: column; align-items: stretch; }
            .calendar-nav { flex-direction: column; align-items: stretch; }
            .slots-grid { grid-template-columns: 1fr; }
            .login-card { padding: 2rem 1.5rem; }
            .week-grid { grid-template-columns: repeat(4, 1fr); }
            .month-grid { grid-template-columns: repeat(4, 1fr); }
            .day-lessons-table { min-width: 400px; }
            .autocomplete-list { max-height: 150px; }
        }
        @media (max-width: 500px) {
            .week-grid, .month-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
<div class="app-container" id="app">
    <!-- ЭКРАН ВХОДА -->
    <div v-if="!isLoggedIn" class="login-overlay">
        <div class="login-card">
            <h2><i class="fas fa-leaf"></i> Ученический сад</h2>
            <p class="subtitle">Войдите как репетитор или родитель</p>
            
            <div v-if="loginError" class="error">{{ loginError }}</div>
            
            <div class="role-selector">
                <button :class="{ active: selectedRole === 'tutor' }" @click="selectedRole = 'tutor'">
                    <i class="fas fa-chalkboard-teacher"></i> Репетитор
                </button>
                <button :class="{ active: selectedRole === 'parent' }" @click="selectedRole = 'parent'">
                    <i class="fas fa-user-friends"></i> Родитель
                </button>
            </div>
            
            <div v-if="!showRegister">
                <div class="field-group">
                    <label><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" v-model="loginEmail" placeholder="your@email.com" @keydown.enter="login">
                </div>
                <div class="field-group">
                    <label><i class="fas fa-lock"></i> Пароль</label>
                    <input type="password" v-model="loginPassword" placeholder="••••••••" @keydown.enter="login">
                </div>
                <button class="btn-primary" @click="login"><i class="fas fa-sign-in-alt"></i> Войти</button>
                <div style="margin-top: 1rem;">
                    <button class="btn-secondary" @click="showRegister = !showRegister">
                        <i class="fas fa-user-plus"></i> Нет аккаунта? Зарегистрироваться
                    </button>
                </div>
            </div>
            
            <div v-else>
                <div class="field-group">
                    <label><i class="fas fa-user"></i> Ваше имя</label>
                    <input type="text" v-model="registerName" placeholder="Анна" @keydown.enter="register">
                </div>
                <div class="field-group">
                    <label><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" v-model="registerEmail" placeholder="your@email.com" @keydown.enter="register">
                </div>
                <div class="field-group">
                    <label><i class="fas fa-lock"></i> Пароль (мин. 6 символов)</label>
                    <input type="password" v-model="registerPassword" placeholder="••••••••" @keydown.enter="register">
                </div>
                <div class="field-group">
                    <label><i class="fas fa-user-tag"></i> Кто вы?</label>
                    <select v-model="selectedRole" style="width:100%;padding:0.8rem 1.2rem;border-radius:60px;border:1px solid #dcc7e2;font-size:1rem;outline:none;background:white;">
                        <option value="tutor">👩‍🏫 Репетитор</option>
                        <option value="parent" selected>👨‍👩‍👦 Родитель</option>
                    </select>
                </div>
                <button class="btn-primary" @click="register" style="background:#a47bae;"><i class="fas fa-user-plus"></i> Зарегистрироваться</button>
                <div style="margin-top: 0.8rem;">
                    <button class="btn-secondary" @click="showRegister = !showRegister">
                        <i class="fas fa-arrow-left"></i> Назад к входу
                    </button>
                </div>
            </div>
            
            <div class="hint">
                <i class="fas fa-cloud-upload-alt"></i> Данные сохраняются в облаке
            </div>
        </div>
    </div>

    <!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
    <template v-if="isLoggedIn">
        <div class="header-botanical">
            <h1><i class="fas fa-leaf"></i> ученический сад</h1>
            <span class="botanical-icon">
                <i class="fas fa-user-circle"></i> {{ userEmail }}
                <span class="role-badge" :class="{ parent: userRole === 'parent' }">
                    {{ userRole === 'tutor' ? '👩‍🏫 Репетитор' : '👨‍👩‍👦 Родитель' }}
                </span>
                <button class="btn-circle" @click="logout" style="width:auto;padding:0 0.8rem;font-size:0.8rem;background:#e9d4ed;border-color:#d5b8dc;">
                    <i class="fas fa-sign-out-alt"></i> Выйти
                </button>
            </span>
        </div>

        <!-- Вкладки для репетитора -->
        <div v-if="userRole === 'tutor'" class="tabs">
            <button class="tab-btn" :class="{ active: viewMode === 'slots' }" @click="viewMode = 'slots'">
                <i class="fas fa-clock"></i> Слоты
            </button>
            <button class="tab-btn" :class="{ active: viewMode === 'diary' }" @click="viewMode = 'diary'">
                <i class="fas fa-book"></i> Дневник
            </button>
            <button class="tab-btn" :class="{ active: viewMode === 'students' }" @click="viewMode = 'students'">
                <i class="fas fa-users"></i> Ученики
            </button>
            <button class="tab-btn" :class="{ active: viewMode === 'schedule' }" @click="viewMode = 'schedule'">
                <i class="fas fa-calendar-alt"></i> Расписание
            </button>
            <button class="tab-btn" :class="{ active: viewMode === 'bookings' }" @click="viewMode = 'bookings'">
                <i class="fas fa-calendar-check"></i> Записи родителей
            </button>
        </div>

        <!-- Вкладки для родителя -->
        <div v-else class="tabs">
            <button class="tab-btn" :class="{ active: viewMode === 'slots' }" @click="viewMode = 'slots'">
                <i class="fas fa-clock"></i> Свободные слоты
            </button>
            <button class="tab-btn" :class="{ active: viewMode === 'mybookings' }" @click="viewMode = 'mybookings'">
                <i class="fas fa-calendar-check"></i> Мои записи
            </button>
        </div>

        <!-- ===== РЕЖИМ РЕПЕТИТОРА ===== -->
        <template v-if="userRole === 'tutor'">
            <!-- 1. СЛОТЫ -->
            <div v-if="viewMode === 'slots'">
                <div class="add-slot-form">
                    <div class="field-group">
                        <label><i class="fas fa-calendar-day"></i> Дата</label>
                        <input type="date" v-model="newSlotDate">
                    </div>
                    <div class="field-group">
                        <label><i class="far fa-clock"></i> Время</label>
                        <input type="text" v-model="newSlotTime" placeholder="15:00–16:30">
                    </div>
                    <div class="field-group">
                        <label><i class="fas fa-coins"></i> Стоимость</label>
                        <input type="text" v-model="newSlotPrice" placeholder="1500 ₽">
                    </div>
                    <button class="btn-primary" @click="addSlot"><i class="fas fa-plus-circle"></i> Добавить слот</button>
                </div>

                <div class="slots-grid" v-if="tutorSlots.length > 0">
                    <div v-for="slot in tutorSlots" :key="slot.id" class="slot-card" :class="{ booked: slot.booked }">
                        <div class="time">{{ slot.time }}</div>
                        <div>{{ slot.date }}</div>
                        <div style="font-weight:500;">{{ slot.price }}</div>
                        <span class="status" :class="{ free: !slot.booked, booked: slot.booked }">
                            {{ slot.booked ? '📕 Занято' : '📗 Свободно' }}
                        </span>
                        <div v-if="slot.booked && slot.student" class="student-info">
                            <div><strong>👤 {{ slot.student.name }}</strong></div>
                            <div>📞 {{ slot.student.parent_phone || slot.student.phone || '' }}</div>
                            <div>🏫 {{ slot.student.class || '' }}</div>
                            <div style="font-size:0.8rem;color:#6a4e72;">Родитель: {{ slot.student.parent_name || '' }}</div>
                            <div style="font-size:0.8rem;color:#6a4e72;">📝 {{ slot.student.note || '' }}</div>
                        </div>
                        <div class="actions">
                            <button v-if="!slot.booked" class="btn-delete" @click="deleteSlot(slot.id)">
                                <i class="fas fa-trash"></i> Удалить
                            </button>
                            <button v-if="slot.booked" class="btn-cancel" @click="cancelSlotBooking(slot.id)">
                                <i class="fas fa-times"></i> Отменить запись
                            </button>
                        </div>
                    </div>
                </div>
                <div v-else class="no-data">
                    <i class="fas fa-clock"></i>
                    <p>Нет созданных слотов</p>
                </div>
            </div>

            <!-- 2. ДНЕВНИК -->
            <div v-if="viewMode === 'diary'">
                <div class="add-student-section">
                    <div class="field-group">
                        <label><i class="fas fa-user-graduate"></i> Ученик</label>
                        <div class="autocomplete-container">
                            <input type="text" v-model="newStudentName" @input="filterStudents" @blur="closeAutocomplete" @focus="filterStudents" placeholder="Введите имя ученика...">
                            <div v-if="showAutocomplete && filteredStudentList.length > 0" class="autocomplete-list">
                                <div v-for="student in filteredStudentList" :key="student.name + student.phone" class="autocomplete-item" @mousedown.prevent="selectStudent(student)">
                                    <span class="student-name">{{ student.name }}</span>
                                    <span class="student-info">
                                        {{ student.class || '—' }} · {{ student.parent_phone || '—' }}
                                        <span style="font-size:0.7rem;color:#9a82a2;">({{ student.totalLessons || 0 }} занятий)</span>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="field-group"><label><i class="fas fa-calendar-day"></i> Дата</label><input type="date" v-model="newLessonDate"></div>
                    <div class="field-group"><label><i class="far fa-clock"></i> Время</label><input v-model="newLessonTime" placeholder="15:00–16:30"></div>
                    <div class="field-group"><label><i class="fas fa-coins"></i> Стоимость</label><input v-model="newLessonPrice" placeholder="1500 ₽"></div>
                    <div class="field-group"><label><i class="fas fa-user-tag"></i> Класс</label><input v-model="newLessonClass" placeholder="7А"></div>
                    <div class="field-group" style="flex:0.6;"><label><i class="fas fa-check-circle"></i> Оплата</label>
                        <select v-model="newLessonPaid"><option value="paid">✅ Оплачено</option><option value="unpaid">❌ Не оплачено</option></select>
                    </div>
                    <div class="field-group" style="flex:1;"><label><i class="fas fa-pen-fancy"></i> Заметка</label><input v-model="newLessonNote" placeholder="Тема, долг..."></div>
                    <button class="btn-primary" @click="addDiaryLesson"><i class="fas fa-plus-circle"></i> Добавить</button>
                </div>

                <div class="day-students-grid">
                    <div v-if="diaryStudents.length === 0" class="no-data">
                        <i class="fas fa-book"></i>
                        <p>Нет занятий на {{ formattedSelectedDate }}</p>
                    </div>
                    <div v-for="(student, idx) in diaryStudents" :key="idx" class="day-student-card">
                        <div class="day-student-header">
                            <span class="day-student-name">
                                <i class="fas fa-user-circle"></i> {{ student.name }}
                                <span style="background:#ebdfef;padding:0.2rem 1rem;border-radius:60px;font-size:0.8rem;color:#46304b;">{{ student.lessons.length }} занятий</span>
                            </span>
                            <button class="btn-danger" @click="removeStudentFromDiary(student.originalIndex)">
                                <i class="fas fa-trash-alt"></i> удалить ученика
                            </button>
                        </div>
                        <div class="day-lessons-table-wrap">
                            <table class="day-lessons-table">
                                <thead>
                                    <tr>
                                        <th>Время</th>
                                        <th>Стоимость</th>
                                        <th>Класс</th>
                                        <th>Статус оплаты</th>
                                        <th>Заметка</th>
                                        <th>Источник</th>
                                        <th style="width:100px;">Действия</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr v-for="(lesson, lIdx) in student.lessons" :key="lIdx">
                                        <td>{{ lesson.time }}</td>
                                        <td>{{ lesson.price }}</td>
                                        <td>{{ lesson.student_class || '—' }}</td>
                                        <td>
                                            <button class="status-paid" :class="lesson.paid === 'paid' ? 'paid' : 'unpaid'" 
                                                    @click="toggleDiaryPaid(student.originalIndex, lesson.originalIndex)"
                                                    style="border:none;cursor:pointer;padding:0.3rem 1rem;border-radius:60px;font-size:0.85rem;">
                                                {{ lesson.paid === 'paid' ? '✅ Оплачено' : '❌ Не оплачено' }}
                                            </button>
                                        </td>
                                        <td>
                                            <span class="note-badge" :title="lesson.note || '—'">
                                                {{ lesson.note || '—' }}
                                            </span>
                                        </td>
                                        <td>
                                            <span class="source-badge" :class="lesson.source || 'tutor'">
                                                {{ lesson.source === 'parent' ? '👨‍👩‍👦 Родитель' : '📝 Репетитор' }}
                                            </span>
                                        </td>
                                        <td>
                                            <button class="btn-icon" @click="removeDiaryLesson(student.originalIndex, lesson.originalIndex)" title="Удалить занятие">
                                                <i class="fas fa-trash" style="color:#a079aa;"></i>
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 3. УЧЕНИКИ -->
            <div v-if="viewMode === 'students'">
                <div class="add-student-section" style="background:#fcf8fe;border-radius:40px;padding:1.5rem 2rem;margin:1.5rem 0;border:1px solid #dcc7e2;">
                    <div class="field-group"><label><i class="fas fa-user-graduate"></i> Имя ученика *</label><input v-model="newStudentForm.name" placeholder="Имя"></div>
                    <div class="field-group"><label><i class="fas fa-user-tag"></i> Класс</label><input v-model="newStudentForm.class" placeholder="7А"></div>
                    <div class="field-group"><label><i class="fas fa-phone"></i> Телефон родителя</label><input v-model="newStudentForm.phone" placeholder="+7 999 123-45-67"></div>
                    <div class="field-group"><label><i class="fas fa-user"></i> Имя родителя</label><input v-model="newStudentForm.parent_name" placeholder="Анна"></div>
                    <button class="btn-primary" @click="addStudent"><i class="fas fa-plus-circle"></i> Добавить ученика</button>
                </div>

                <div class="slots-grid" v-if="allStudents.length > 0">
                    <div v-for="(student, index) in allStudents" :key="student.name + student.phone + index" class="slot-card">
                        <div v-if="!student.isEditing">
                            <div style="font-size:1.2rem;font-weight:500;">
                                <i class="fas fa-user-circle"></i> {{ student.name }}
                                <span style="font-size:0.8rem;color:#6a4e72;font-weight:400;">({{ student.source || 'tutor' }})</span>
                            </div>
                            <div>📞 {{ student.parent_phone || student.phone || '—' }}</div>
                            <div>🏫 {{ student.class || '—' }}</div>
                            <div style="font-size:0.8rem;color:#6a4e72;">👤 {{ student.parent_name || '—' }}</div>
                            <div style="margin-top:0.5rem;font-size:0.9rem;color:#6a4e72;">
                                Всего занятий: {{ student.totalLessons || 0 }}
                            </div>
                            <div class="student-card-actions" style="margin-top:0.5rem;padding-top:0.5rem;border-top:1px dashed #e8d9ed;">
                                <button class="btn-edit" @click="startEditStudent(index)">
                                    <i class="fas fa-pen"></i> Редактировать
                                </button>
                                <button class="btn-delete-student" @click="deleteStudent(student.name)" title="Удалить ученика">
                                    <i class="fas fa-trash"></i> Удалить
                                </button>
                            </div>
                        </div>
                        <div v-else class="edit-student-form">
                            <div class="field-group">
                                <label><i class="fas fa-user-graduate"></i> Имя ученика *</label>
                                <input v-model="editStudentData.name" placeholder="Имя">
                            </div>
                            <div class="field-group">
                                <label><i class="fas fa-user-tag"></i> Класс</label>
                                <input v-model="editStudentData.class" placeholder="7А">
                            </div>
                            <div class="field-group">
                                <label><i class="fas fa-phone"></i> Телефон родителя</label>
                                <input v-model="editStudentData.phone" placeholder="+7 999 123-45-67">
                            </div>
                            <div class="field-group">
                                <label><i class="fas fa-user"></i> Имя родителя</label>
                                <input v-model="editStudentData.parent_name" placeholder="Анна">
                            </div>
                            <div class="edit-actions">
                                <button class="btn-save" @click="saveEditStudent(index)">
                                    <i class="fas fa-check"></i> Сохранить
                                </button>
                                <button class="btn-cancel-edit" @click="cancelEditStudent(index)">
                                    <i class="fas fa-times"></i> Отмена
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <div v-else class="no-data">
                    <i class="fas fa-users"></i>
                    <p>Пока нет учеников</p>
                </div>
            </div>

            <!-- 4. РАСПИСАНИЕ (ЕДИНОЕ) -->
            <div v-if="viewMode === 'schedule'">
                <div class="tabs" style="margin-bottom:1rem;">
                    <button class="tab-btn" :class="{ active: scheduleView === 'day' }" @click="scheduleView = 'day'">
                        <i class="fas fa-day"></i> День
                    </button>
                    <button class="tab-btn" :class="{ active: scheduleView === 'week' }" @click="scheduleView = 'week'">
                        <i class="fas fa-week"></i> Неделя
                    </button>
                    <button class="tab-btn" :class="{ active: scheduleView === 'month' }" @click="scheduleView = 'month'">
                        <i class="fas fa-month"></i> Месяц
                    </button>
                    <button class="tab-btn copy-btn" @click="openCopyModal" style="background:#d9ebd9;border-color:#b8d5b8;color:#1f5420;">
                        <i class="fas fa-copy"></i> Копировать день
                    </button>
                </div>

                <div class="calendar-nav">
                    <div class="nav-group">
                        <button class="btn-circle" @click="changeSchedulePeriod(-1)"><i class="fas fa-chevron-left"></i></button>
                        <button class="btn-circle today-btn" @click="goTodaySchedule"><i class="fas fa-calendar-day"></i> Сегодня</button>
                        <button class="btn-circle" @click="changeSchedulePeriod(1)"><i class="fas fa-chevron-right"></i></button>
                    </div>
                    <div class="date-display"><i class="far fa-calendar-alt"></i> {{ schedulePeriodLabel }}</div>
                </div>

                <!-- ДЕНЬ -->
                <div v-if="scheduleView === 'day'">
                    <div class="day-students-grid">
                        <div v-if="dayLessons.length === 0" class="no-data">
                            <i class="fas fa-seedling"></i>
                            <p>Нет занятий на {{ formattedScheduleDate }}</p>
                        </div>
                        <div v-for="(student, idx) in dayLessons" :key="idx" class="day-student-card">
                            <div class="day-student-header">
                                <span class="day-student-name">
                                    <i class="fas fa-user-circle"></i> {{ student.name }}
                                    <span style="background:#ebdfef;padding:0.2rem 1rem;border-radius:60px;font-size:0.8rem;color:#46304b;">{{ student.lessons.length }} занятий</span>
                                </span>
                            </div>
                            <div class="day-lessons-table-wrap">
                                <table class="day-lessons-table">
                                    <thead>
                                        <tr>
                                            <th>Время</th>
                                            <th>Стоимость</th>
                                            <th>Класс</th>
                                            <th>Статус</th>
                                            <th>Заметка</th>
                                            <th>Источник</th>
                                            <th style="width:130px;">Действия</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr v-for="(lesson, lIdx) in student.lessons" :key="lIdx">
                                            <td>{{ lesson.time }}</td>
                                            <td>{{ lesson.price }}</td>
                                            <td>{{ lesson.student_class || '—' }}</td>
                                            <td>
                                                <span v-if="lesson.paid === 'paid'" class="status-paid"><i class="fas fa-check-circle"></i> оплачено</span>
                                                <span v-else class="status-unpaid"><i class="fas fa-exclamation-circle"></i> не оплачено</span>
                                            </td>
                                            <td><span class="note-badge" :title="lesson.note || '—'">{{ lesson.note || '—' }}</span></td>
                                            <td>
                                                <span class="source-badge" :class="lesson.source || 'tutor'">
                                                    {{ lesson.source === 'parent' ? '👨‍👩‍👦 Родитель' : '📝 Репетитор' }}
                                                </span>
                                            </td>
                                            <td>
                                                <div style="display:flex;gap:0.3rem;flex-wrap:wrap;">
                                                    <button class="btn-icon" @click="toggleSchedulePaid(lesson.id)" title="Сменить оплату">
                                                        <i class="fas fa-sync-alt"></i>
                                                    </button>
                                                    <button class="btn-icon" @click="deleteScheduleLesson(lesson.id)" title="Удалить занятие">
                                                        <i class="fas fa-trash" style="color:#a079aa;"></i>
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- НЕДЕЛЯ -->
                <div v-if="scheduleView === 'week'">
                    <div class="week-grid">
                        <div v-for="day in weekDays" :key="day.date" class="day-cell" :class="{ today: day.isToday }">

<script>
    // ==========================================
    // ⭐ ВСТАВЬТЕ ВАШИ ДАННЫЕ СЮДА ⭐
    // ==========================================
    const SUPABASE_URL = 'https://nmvsdljxxwghwpmjnoxh.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_TexxaSVrxSpUXBh0tIR7Tw_6-Sdlsm_';
    // ==========================================

    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    new Vue({
        el: '#app',
        data: {
            isLoggedIn: false,
            userEmail: '',
            userRole: 'parent',
            selectedRole: 'parent',
            loginEmail: '',
            loginPassword: '',
            loginError: '',
            showRegister: false,
            registerName: '',
            registerEmail: '',
            registerPassword: '',
            
            // Слоты
            slots: [],
            tutorSlots: [],
            freeSlots: [],
            
            // Записи
            myBookings: [],
            allBookings: [],
            
            // Дневник (единое расписание)
            diaryStudents: [],
            diaryLessons: [],
            
            // Ученики (единая база)
            allStudents: [],
            
            // Просмотр расписания
            scheduleView: 'day',
            scheduleDate: new Date(),
            
            viewMode: 'slots',
            
            // Форма добавления слота
            newSlotDate: '',
            newSlotTime: '',
            newSlotPrice: '',
            
            // Форма добавления занятия в дневник
            newStudentName: '',
            newLessonDate: '',
            newLessonTime: '',
            newLessonPrice: '',
            newLessonClass: '',
            newLessonPaid: 'paid',
            newLessonNote: '',
            
            // Автокомплит
            showAutocomplete: false,
            filteredStudentList: [],
            
            // Форма добавления ученика
            newStudentForm: {
                name: '',
                class: '',
                phone: '',
                parent_name: ''
            },
            
            // Редактирование ученика
            editStudentData: {},
            editingStudentIndex: -1,
            
            // Сохраненные данные родителя
            savedParentData: null,
            
            // Копирование
            copyModalVisible: false,
            copySourceDate: '',
            copyTargetDate: '',
            copyAction: 'copy',
            
            tutorPhone: '+7 952 246-81-85'
        },
        computed: {
            formattedSelectedDate() {
                const d = this.scheduleDate; 
                return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;
            },
            selectedDateStr() {
                const d = this.scheduleDate; 
                return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            },
            formattedScheduleDate() {
                const d = this.scheduleDate; 
                return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;
            },
            scheduleDateStr() {
                const d = this.scheduleDate; 
                return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            },
            schedulePeriodLabel() {
                if (this.scheduleView === 'day') return this.formattedScheduleDate;
                if (this.scheduleView === 'week') {
                    const start = this.weekStart; 
                    const end = new Date(start); 
                    end.setDate(end.getDate()+6);
                    return `${String(start.getDate()).padStart(2,'0')}.${String(start.getMonth()+1).padStart(2,'0')} – ${String(end.getDate()).padStart(2,'0')}.${String(end.getMonth()+1).padStart(2,'0')}`;
                }
                const d = this.scheduleDate; 
                return `${this.monthNames[d.getMonth()]} ${d.getFullYear()}`;
            },
            weekStart() {
                const d = new Date(this.scheduleDate); 
                d.setDate(d.getDate() - d.getDay()); 
                return d;
            },
            weekDays() {
                const start = new Date(this.weekStart); 
                const days = [];
                for (let i = 0; i < 7; i++) {
                    const d = new Date(start); 
                    d.setDate(d.getDate() + i);
                    const dateStr = this.formatDate(d);
                    const today = new Date(); 
                    const isToday = d.getDate() === today.getDate() && d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear();
                    const lessons = this.getDiaryLessonsForDate(dateStr);
                    days.push({ 
                        date: dateStr, 
                        weekday: ['вс','пн','вт','ср','чт','пт','сб'][d.getDay()], 
                        dayNum: d.getDate(), 
                        isToday, 
                        lessons 
                    });
                }
                return days;
            },
            monthDays() {
                const d = new Date(this.scheduleDate); 
                d.setDate(1);
                const firstDay = d.getDay();
                const monthStart = new Date(d); 
                monthStart.setDate(1 - firstDay);
                const days = [];
                const today = new Date();
                for (let i = 0; i < 42; i++) {
                    const date = new Date(monthStart); 
                    date.setDate(monthStart.getDate() + i);
                    const dateStr = this.formatDate(date);
                    const isCurrentMonth = date.getMonth() === d.getMonth();
                    const isToday = date.getDate() === today.getDate() && date.getMonth() === today.getMonth() && date.getFullYear() === today.getFullYear();
                    const lessons = this.getDiaryLessonsForDate(dateStr);
                    days.push({ 
                        date: dateStr, 
                        weekdayShort: ['вс','пн','вт','ср','чт','пт','сб'][date.getDay()], 
                        dayNum: date.getDate(), 
                        isCurrentMonth, 
                        isToday, 
                        lessons 
                    });
                }
                return days;
            },
            dayLessons() {
                const dateStr = this.scheduleDateStr;
                const result = [];
                const studentsMap = new Map();
                
                this.diaryLessons.filter(l => l.date === dateStr).forEach(l => {
                    if (!studentsMap.has(l.student_name)) {
                        studentsMap.set(l.student_name, {
                            name: l.student_name,
                            lessons: []
                        });
                    }
                    studentsMap.get(l.student_name).lessons.push({
                        ...l,
                        source: l.source || 'tutor'
                    });
                });
                
                return Array.from(studentsMap.values());
            },
            monthNames() { return ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь']; }
        },
        methods: {
            formatDate(date) {
                return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
            },
            
            // ===== АВТОРИЗАЦИЯ =====
            async login() {
                this.loginError = '';
                if (!this.loginEmail || !this.loginPassword) {
                    this.loginError = 'Введите email и пароль';
                    return;
                }
                try {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({
                        email: this.loginEmail,
                        password: this.loginPassword
                    });
                    if (error) throw error;
                    
                    const { data: userData, error: userError } = await supabaseClient
                        .from('users')
                        .select('role')
                        .eq('id', data.user.id)
                        .maybeSingle();
                    
                    if (userError || !userData) {
                        const defaultRole = this.selectedRole === 'tutor' ? 'tutor' : 'parent';
                        await supabaseClient
                            .from('users')
                            .insert({
                                id: data.user.id,
                                email: data.user.email,
                                name: data.user.user_metadata?.name || 'Пользователь',
                                role: defaultRole
                            });
                        this.userRole = defaultRole;
                    } else {
                        this.userRole = userData.role || 'parent';
                    }
                    
                    if (this.userRole !== this.selectedRole) {
                        await supabaseClient
                            .from('users')
                            .update({ role: this.selectedRole })
                            .eq('id', data.user.id);
                        this.userRole = this.selectedRole;
                    }
                    
                    this.userEmail = data.user.email;
                    this.isLoggedIn = true;
                    this.loginEmail = '';
                    this.loginPassword = '';
                    this.loginError = '';
                    
                    this.loadSavedParentData();
                    await this.loadData();
                } catch (e) {
                    console.error('Ошибка входа:', e);
                    this.loginError = e.message || 'Ошибка входа. Проверьте email и пароль.';
                }
            },
            
            async register() {
                this.loginError = '';
                if (!this.registerEmail || !this.registerPassword || !this.registerName) {
                    this.loginError = 'Заполните все поля';
                    return;
                }
                if (this.registerPassword.length < 6) {
                    this.loginError = 'Пароль должен быть минимум 6 символов';
                    return;
                }
                try {
                    const { data, error } = await supabaseClient.auth.signUp({
                        email: this.registerEmail,
                        password: this.registerPassword,
                        options: {
                            data: { 
                                name: this.registerName,
                                role: this.selectedRole 
                            }
                        }
                    });
                    if (error) throw error;
                    
                    if (data.user) {
                        await supabaseClient
                            .from('users')
                            .insert({
                                id: data.user.id,
                                email: this.registerEmail,
                                name: this.registerName,
                                role: this.selectedRole
                            });
                    }
                    
                    alert(`✅ Регистрация успешна! Вы зарегистрированы как ${this.selectedRole === 'tutor' ? 'репетитор' : 'родитель'}. Проверьте почту для подтверждения.`);
                    this.showRegister = false;
                    this.registerName = '';
                    this.registerEmail = '';
                    this.registerPassword = '';
                    this.loginEmail = this.registerEmail;
                    this.loginError = '✅ Теперь войдите с вашим email и паролем.';
                } catch (e) {
                    console.error('Ошибка регистрации:', e);
                    this.loginError = e.message || 'Ошибка регистрации.';
                }
            },
            
            async logout() {
                await supabaseClient.auth.signOut();
                this.isLoggedIn = false;
                this.userEmail = '';
                this.userRole = '';
                this.tutorSlots = [];
                this.freeSlots = [];
                this.myBookings = [];
                this.allBookings = [];
                this.allStudents = [];
                this.diaryStudents = [];
                this.diaryLessons = [];
                this.savedParentData = null;
                localStorage.removeItem('savedParentData');
            },
            
            // ===== СОХРАНЕНИЕ ДАННЫХ РОДИТЕЛЯ =====
            loadSavedParentData() {
                try {
                    const saved = localStorage.getItem('savedParentData');
                    if (saved) {

            // ===== ГЛАВНАЯ ЛОГИКА: ЗАПИСЬ РОДИТЕЛЯ =====
            async bookSlot(slot) {
                const form = slot.bookForm;
                if (!form.parent_name || !form.parent_phone || !form.student_name) {
                    alert('Заполните имя и телефон родителя, а также имя ученика');
                    return;
                }
                const user = await supabaseClient.auth.getUser();
                
                // 1. Проверяем, не занят ли слот
                const { data: slotCheck, error: checkError } = await supabaseClient
                    .from('slots')
                    .select('booked')
                    .eq('id', slot.id)
                    .single();
                
                if (checkError) {
                    alert('Ошибка проверки слота');
                    return;
                }
                
                if (slotCheck.booked) {
                    alert('Этот слот уже занят!');
                    await this.loadFreeSlots();
                    return;
                }
                
                // 2. СОЗДАЕМ ЗАНЯТИЕ В ДНЕВНИКЕ (ГЛАВНОЕ ХРАНИЛИЩЕ!)
                const { data: diaryData, error: diaryError } = await supabaseClient
                    .from('diary_lessons')
                    .insert({
                        tutor_id: slot.tutor_id,
                        student_name: form.student_name,
                        student_class: form.student_class || '',
                        date: slot.date,
                        time: slot.time,
                        price: slot.price,
                        paid: 'unpaid',
                        source: 'parent',
                        note: `${form.note || ''} (Запись от родителя ${form.parent_name}, тел: ${form.parent_phone})`
                    })
                    .select();
                
                if (diaryError) {
                    alert('Ошибка создания занятия: ' + diaryError.message);
                    return;
                }
                
                // 3. СОЗДАЕМ ЗАПИСЬ В BOOKINGS (СВЯЗЬ С РОДИТЕЛЕМ)
                const { error: bookingError } = await supabaseClient
                    .from('bookings')
                    .insert({
                        slot_id: slot.id,
                        parent_id: user.data.user.id,
                        tutor_id: slot.tutor_id,
                        diary_lesson_id: diaryData[0].id,
                        parent_name: form.parent_name,
                        parent_phone: form.parent_phone,
                        student_name: form.student_name,
                        student_class: form.student_class || '',
                        student_phone: form.parent_phone,
                        note: form.note || ''
                    });
                
                if (bookingError) {
                    // Откатываем созданное занятие
                    await supabaseClient
                        .from('diary_lessons')
                        .delete()
                        .eq('id', diaryData[0].id);
                    alert('Ошибка записи: ' + bookingError.message);
                    return;
                }
                
                // 4. ОБНОВЛЯЕМ СЛОТ - ПОМЕЧАЕМ КАК ЗАНЯТЫЙ
                await supabaseClient
                    .from('slots')
                    .update({ 
                        booked: true, 
                        student: { 
                            name: form.student_name,
                            class: form.student_class || '',
                            parent_name: form.parent_name,
                            parent_phone: form.parent_phone,
                            note: form.note || ''
                        } 
                    })
                    .eq('id', slot.id);
                
                // 5. Сохраняем данные родителя
                this.saveParentData({
                    parent_name: form.parent_name,
                    parent_phone: form.parent_phone,
                    student_name: form.student_name,
                    student_class: form.student_class || '',
                    note: form.note || ''
                });
                
                // 6. ОБНОВЛЯЕМ ВСЕ СПИСКИ
                await this.loadFreeSlots();      
                await this.loadMyBookings();     
                await this.loadAllBookings();    
                await this.loadAllStudents();    
                await this.loadDiary();          
                await this.loadTutorSlots();     
                
                alert('✅ Вы успешно записались! Занятие добавлено в расписание репетитора.');
            },

            // ===== ПРОВЕРКА ОТМЕНЫ =====
            canCancelBooking(booking) {
                if (!booking.slot) return false;
                try {
                    const dateParts = booking.slot.date.split('-');
                    const timeParts = booking.slot.time.split('–')[0].trim().split(':');
                    
                    const lessonDateTime = new Date(
                        parseInt(dateParts[0]),
                        parseInt(dateParts[1]) - 1,
                        parseInt(dateParts[2]),
                        parseInt(timeParts[0]),
                        parseInt(timeParts[1] || 0)
                    );
                    
                    const now = new Date();
                    const diffHours = (lessonDateTime - now) / (1000 * 60 * 60);
                    
                    return diffHours > 1;
                } catch (e) {
                    console.error('Ошибка проверки времени:', e);
                    return false;
                }
            },

                if (!student) return;
                if (confirm(`Удалить все занятия ученика "${student.name}"?`)) {
                    const lessons = this.diaryLessons.filter(l => l.student_name === student.name);
                    for (const lesson of lessons) {
                        await supabaseClient
                            .from('diary_lessons')
                            .delete()
                            .eq('id', lesson.id);
                    }
                    await this.loadDiary();
                    await this.loadTutorSlots();
                    await this.loadAllBookings();
                    await this.loadAllStudents();
                }
            },
            
            quickAddToDiary(date) {
                this.viewMode = 'diary';
                this.newLessonDate = date;
                const d = new Date(date);
                if (!isNaN(d)) this.scheduleDate = d;
            },
            
            // ===== УПРАВЛЕНИЕ В РАСПИСАНИИ =====
            async toggleSchedulePaid(lessonId) {
                const lesson = this.diaryLessons.find(l => l.id === lessonId);
                if (!lesson) return;
                
                const newStatus = lesson.paid === 'paid' ? 'unpaid' : 'paid';
                await supabaseClient
                    .from('diary_lessons')
                    .update({ paid: newStatus })
                    .eq('id', lessonId);
                
                await this.loadDiary();
                await this.loadTutorSlots();
                await this.loadAllBookings();
            },
            
            async deleteScheduleLesson(lessonId) {
                if (!confirm('Удалить это занятие?')) return;
                
                await supabaseClient
                    .from('diary_lessons')
                    .delete()
                    .eq('id', lessonId);
                
                await this.loadDiary();
                await this.loadTutorSlots();
                await this.loadAllBookings();
                await this.loadAllStudents();
            },
            
            // ===== УПРАВЛЕНИЕ ЗАПИСЯМИ РОДИТЕЛЕЙ (РЕПЕТИТОР) =====
            async toggleBookingPaid(bookingId) {
                const booking = this.allBookings.find(b => b.id === bookingId);
                if (!booking) return;
                
                const diaryLesson = this.diaryLessons.find(
                    l => l.id === booking.diary_lesson_id
                );
                
                if (!diaryLesson) {
                    alert('Занятие не найдено в дневнике.');
                    return;
                }
                
                const newStatus = diaryLesson.paid === 'paid' ? 'unpaid' : 'paid';
                await supabaseClient
                    .from('diary_lessons')
                    .update({ paid: newStatus })
                    .eq('id', diaryLesson.id);
                
                await this.loadDiary();
                await this.loadAllBookings();
            },
            
            async deleteBooking(bookingId) {
                if (confirm('Удалить эту запись? Это действие нельзя отменить.')) {
                    const booking = this.allBookings.find(b => b.id === bookingId);
                    if (booking) {
                        await supabaseClient
                            .from('bookings')
                            .delete()
                            .eq('id', bookingId);
                        
                        await supabaseClient
                            .from('slots')
                            .update({ booked: false, student: null })
                            .eq('id', booking.slot_id);
                        
                        await supabaseClient
                            .from('diary_lessons')
                            .delete()
                            .eq('id', booking.diary_lesson_id);
                    }
                    
                    await this.loadAllBookings();
                    await this.loadTutorSlots();
                    await this.loadAllStudents();
                    await this.loadDiary();
                    await this.loadFreeSlots();
                }
            },
            
            // ===== РАСПИСАНИЕ =====
            changeSchedulePeriod(delta) {
                if (this.scheduleView === 'day') { 
                    const d = new Date(this.scheduleDate); 
                    d.setDate(d.getDate()+delta); 
                    this.scheduleDate = d; 
                } else if (this.scheduleView === 'week') { 
                    const d = new Date(this.scheduleDate); 
                    d.setDate(d.getDate()+delta*7); 
                    this.scheduleDate = d; 
                } else { 
                    const d = new Date(this.scheduleDate); 
                    d.setMonth(d.getMonth()+delta); 
                    this.scheduleDate = d; 
                }
            },
            
            goTodaySchedule() {
                this.scheduleDate = new Date();
            },
            
            // ===== КОПИРОВАНИЕ =====
            openCopyModal() {
                this.copySourceDate = this.scheduleDateStr;
                const d = new Date(this.scheduleDate); 
                d.setDate(d.getDate()+1);
                this.copyTargetDate = this.formatDate(d);
                this.copyModalVisible = true;
            },
            
            async executeCopy() {
                if (!this.copySourceDate || !this.copyTargetDate) { 
                    alert('Выберите даты'); 
                    return; 
                }
                
                const lessonsToCopy = this.diaryLessons.filter(l => l.date === this.copySourceDate);
                
                if (lessonsToCopy.length === 0) { 
                    alert('Нет занятий для копирования'); 
                    return; 
                }
                
                const user = await supabaseClient.auth.getUser();
                
                if (this.copyAction === 'move') {
                    for (const lesson of lessonsToCopy) {
                        await supabaseClient
                            .from('diary_lessons')
                            .delete()
                            .eq('id', lesson.id);
                    }
                }
                
                for (const lesson of lessonsToCopy) {
                    await supabaseClient
                        .from('diary_lessons')
                        .insert({
                            tutor_id: user.data.user.id,
                            student_name: lesson.student_name,
                            student_class: lesson.student_class || '',
                            date: this.copyTargetDate,
                            time: lesson.time,
                            price: lesson.price,
                            paid: lesson.paid,
                            source: lesson.source || 'tutor',
                            note: lesson.note || ''
                        });
                }
                
                this.copyModalVisible = false;
                await this.loadDiary();
                await this.loadTutorSlots();
                await this.loadAllBookings();
                await this.loadAllStudents();
                alert(`Скопировано ${lessonsToCopy.length} занятий на ${this.copyTargetDate}`);
            }
        },
        
        async mounted() {
            const { data } = await supabaseClient.auth.getSession();
            if (data.session) {
                const { data: userData, error } = await supabaseClient
                    .from('users')
                    .select('role')
                    .eq('id', data.session.user.id)
                    .maybeSingle();
                
                if (error) {
                    console.error('Ошибка получения роли:', error);
                }
                
                this.userRole = userData?.role || 'parent';
                this.userEmail = data.session.user.email;
                this.isLoggedIn = true;
                this.loadSavedParentData();
                await this.loadData();
                console.log('🔄 Загружена роль при монтировании:', this.userRole);
            }
            
            supabaseClient.auth.onAuthStateChange(async (event, session) => {
                if (event === 'SIGNED_IN' && session) {
                    this.userEmail = session.user.email;
                    this.isLoggedIn = true;
                    this.loadSavedParentData();
                    
                    const { data: userData } = await supabaseClient
                        .from('users')
                        .select('role')
                        .eq('id', session.user.id)
                        .maybeSingle();
                    
                    this.userRole = userData?.role || 'parent';
                    await this.loadData();
                }
                if (event === 'SIGNED_OUT') {
                    this.isLoggedIn = false;
                    this.userEmail = '';
                    this.userRole = '';
                    this.tutorSlots = [];
                    this.freeSlots = [];
                    this.myBookings = [];
                    this.allBookings = [];
                    this.allStudents = [];
                    this.diaryStudents = [];
                    this.diaryLessons = [];
                }
            });
            
            const today = new Date();
            this.newSlotDate = this.formatDate(today);
            this.newLessonDate = this.formatDate(today);
            this.scheduleDate = today;
        }
    });
</script>
</body>
</html>
